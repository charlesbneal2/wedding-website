<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Trisa & Charles</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<form class="card" id="login" hidden>
  <h1 class="brand">Trisa &amp; Charles</h1>
  <p class="kicker">Admin</p>
  <label>Email <input name="email" type="email" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn" type="submit">Sign in</button>
  <button class="btn secondary" type="button" id="forgot">Forgot password?</button>
  <a class="btn secondary" href="/save-the-date/">Back to save the date</a>
  <p class="msg" id="login-msg" role="alert"></p>
</form>

<form class="card" id="setpw" hidden>
  <h1 class="brand">Trisa &amp; Charles</h1>
  <p class="kicker">Set a new password</p>
  <label>New password <input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8+ characters" required></label>
  <label>Confirm password <input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <button class="btn" type="submit">Save password</button>
  <p class="msg" id="setpw-msg" role="alert"></p>
</form>

<main id="app" hidden>
  <h1 class="brand">Trisa &amp; Charles</h1>
  <p class="kicker">Mailing addresses</p>
  <div class="bar">
    <h2>Addresses <span id="count"></span></h2>
    <input id="filter" type="search" placeholder="Filter by any text" aria-label="Filter rows">
    <a class="btn secondary small" href="/save-the-date/">Save the date page</a>
    <button class="btn secondary small" id="refresh" type="button">Refresh</button>
    <button class="btn secondary small" id="logout" type="button">Sign out</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <div class="scroll" tabindex="0" role="region" aria-label="Mailing addresses table">
    <table>
      <thead><tr>
        <th>Received</th><th>Name</th><th>Email</th><th>Street</th><th>Apt / Unit</th>
        <th>City</th><th>State</th><th>ZIP</th><th>Country</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
