<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mangosteen animation preview</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/save-the-date/save-the-date.css">
<style>
.mangosteen-preview .entrance-address { isolation: isolate; }
.mangosteen-field { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.mangosteen-field img { position: absolute; top: 0; left: 0; image-rendering: pixelated; will-change: transform; }
.mangosteen-field img[hidden] { display: none; }
.mangosteen-preview .entrance-form { position: relative; z-index: 1; }
.mangosteen-preview .entrance-form input { background: var(--form-paper); }
.mangosteen-preview label,
.mangosteen-preview h2,
.mangosteen-preview .entrance-form-intro { width: fit-content; background: var(--form-paper); }
.mangosteen-preview h2,
.mangosteen-preview .entrance-form-intro { margin-left: auto; margin-right: auto; }
.preview-controls { margin: 0 0 2rem; text-align: center; }
.preview-toggle { padding: .5rem 1rem; border: 1px solid var(--berry); border-radius: 999px; background: var(--form-paper); color: inherit; font-size: .75rem; cursor: pointer; }
.preview-note { padding: .5rem; background: var(--form-paper); }
</style>
</head>
<body class="entrance-page mangosteen-preview">
<main class="entrance-address" id="animation-stage">
  <div class="mangosteen-field" aria-hidden="true"></div>
  <div class="entrance-form">
    <form aria-labelledby="address-title" aria-describedby="preview-status">
      <h2 id="address-title">Mailing Address</h2>
      <p class="entrance-form-intro">Formal invitation to follow</p>
      <div class="preview-controls">
        <button class="preview-toggle" type="button" aria-pressed="false" hidden>Pause animation</button>
      </div>
      <div class="field"><label for="name">Name</label>
        <input id="name" type="text" autocomplete="off"></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" type="email" autocomplete="off"></div>
      <div class="field"><label for="address1">Street address</label>
        <input id="address1" type="text" autocomplete="off"></div>
      <div class="field"><label for="address2">Apt / Unit (optional)</label>
        <input id="address2" type="text" autocomplete="off"></div>
      <div class="field"><label for="city">City</label>
        <input id="city" type="text" autocomplete="off"></div>
      <div class="field"><label for="state">State / Province</label>
        <input id="state" type="text" autocomplete="off"></div>
      <div class="field"><label for="zip">ZIP / Postal code</label>
        <input id="zip" type="text" autocomplete="off"></div>
      <div class="field"><label for="country">Country</label>
        <input id="country" type="text" autocomplete="off" value="United States"></div>
      <button class="btn" type="submit" disabled>Send my address</button>
      <p class="submission-status preview-note" id="preview-status" role="status">Animation preview only. No addresses are sent or stored.</p>
    </form>
  </div>
</main>
<script>
(() => {
  const stage = document.querySelector('#animation-stage');
  const field = document.querySelector('.mangosteen-field');
  const toggle = document.querySelector('.preview-toggle');
  const status = document.querySelector('#preview-status');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const sprites = Array.from({ length: 24 }, (_, index) => {
    const image = document.createElement('img');
    const pink = Math.floor((index + 1) * .3) > Math.floor(index * .3);
    image.src = pink ? '/assets/mangosteen-pink.svg' : '/assets/favicon.svg';
    image.alt = '';
    field.append(image);
    return {
      image,
      anchor: (index + Math.random()) / 24,
      band: (index % 3 + .15 + Math.random() * .65) / 3,
      phase: Math.random() * Math.PI * 2,
      speed: 45 + Math.random() * 35,
      delay: index % 4 === 3 ? .75 + Math.random() * 4.25 : 0,
      originX: 0, startY: 0, staticY: 0, finished: false,
    };
  });
  let width = 0;
  let height = 0;
  let size = 0;
  let frame = 0;
  let previous = 0;
  let elapsed = 0;
  let paused = false;
  let complete = false;

  const paint = () => {
    for (const sprite of sprites) {
      const age = elapsed - sprite.delay;
      const y = reducedMotion.matches ? sprite.staticY : sprite.startY + Math.max(0, age) * sprite.speed;
      if (!reducedMotion.matches && age >= 0 && y > height) sprite.finished = true;
      sprite.image.hidden = complete || sprite.finished || (!reducedMotion.matches && age < 0);
      const x = sprite.originX + Math.sin(sprite.phase + elapsed * .7) * Math.min(32, width * .06);
      sprite.image.style.transform = `translate3d(${Math.round(Math.max(0, Math.min(width - size, x)))}px, ${Math.round(y)}px, 0)`;
    }
  };

  function reset() {
    width = stage.clientWidth;
    height = stage.clientHeight;
    size = (width <= 600 ? 32 : 48) * 1.3 * 1.5;
    sprites.forEach(sprite => {
      sprite.image.style.width = `${size}px`;
      sprite.image.style.height = `${size}px`;
      sprite.originX = (width - size) * sprite.anchor;
      sprite.staticY = (Math.min(height, window.innerHeight) - size) * sprite.band;
      sprite.startY = sprite.delay ? -size : sprite.staticY;
    });
    paint();
  }

  function animate(time) {
    const dt = previous ? Math.min((time - previous) / 1000, .035) : 0;
    previous = time;
    elapsed += dt * 1.4;
    paint();
    complete = sprites.every(sprite => sprite.finished);
    if (complete) {
      syncMotion();
      return;
    }
    frame = window.requestAnimationFrame(animate);
  }

  function syncMotion() {
    window.cancelAnimationFrame(frame);
    previous = 0;
    toggle.hidden = reducedMotion.matches;
    toggle.disabled = complete;
    toggle.textContent = complete ? 'Animation complete' : paused ? 'Resume animation' : 'Pause animation';
    toggle.setAttribute('aria-pressed', String(paused));
    status.textContent = reducedMotion.matches
      ? 'Animation preview only. Reduced motion is enabled; artwork is static. No addresses are sent or stored.'
      : 'Animation preview only. No addresses are sent or stored.';
    if (!complete && !paused && !reducedMotion.matches && !document.hidden) {
      frame = window.requestAnimationFrame(animate);
    }
  }

  document.querySelector('form').addEventListener('submit', event => event.preventDefault());
  toggle.addEventListener('click', () => { paused = !paused; syncMotion(); });
  reducedMotion.addEventListener('change', () => { reset(); syncMotion(); });
  document.addEventListener('visibilitychange', syncMotion);
  if ('ResizeObserver' in window) {
    new ResizeObserver(reset).observe(stage);
  } else {
    window.addEventListener('resize', reset);
  }
  reset();
  syncMotion();
})();
</script>
</body>
</html>
